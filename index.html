<script>
var fso=null, shell=null, APP_FOLDER="", DATA_FOLDER="", DB_PATH="", ASSET_FOLDER="", BACKUP_FOLDER="", CSV_FOLDER="", MASTER_EXCEL_PATH="";
var DB=null, SETTINGS={}, CURRENT_USER="", CURRENT_PAGE="dashboard", CURRENT_THEME="dark", GLOBAL_Q="", PAGE_Q="";
var ONLINE_ENABLED=false, ONLINE_DOC_REF=null, ONLINE_LOADED=false, RPT_FROM="", RPT_TO="", RPT_STATUS="", RPT_PAYMENT="", RPT_TECH="", RPT_PHONE="";
var LOGIN_FAILS=0, LOGIN_LOCK_UNTIL=0;
var MENUS=[
 ["dashboard","⌂","Dashboard"],["newjob","+","New Job"],["jobs","▦","Repair Jobs"],["customers","☻","Customers"],
 ["inventory","▣","Inventory"],["payments","$","Payments"],["warranty","✓","Warranty"],
 ["invoice","▤","Invoice"],["pricebook","≡","PriceBook"],["reports","◷","Reports"],["settings","⚙","Settings"]
];

window.onerror=function(msg,url,line){try{toast("System notice: "+msg+" at line "+line);}catch(e){} return true;};

function init(){
 try{window.resizeTo(1240,760);window.moveTo(40,25);}catch(e){}
 try{fso=new ActiveXObject("Scripting.FileSystemObject"); shell=new ActiveXObject("WScript.Shell");}catch(e){fso=null; shell=null;}
 if(fso){
  APP_FOLDER=getAppFolder(); DATA_FOLDER=pathJoin(APP_FOLDER,"data"); ASSET_FOLDER=pathJoin(APP_FOLDER,"assets"); BACKUP_FOLDER=pathJoin(APP_FOLDER,"backups"); CSV_FOLDER=pathJoin(APP_FOLDER,"excel_data"); DB_PATH=pathJoin(DATA_FOLDER,"database.json"); MASTER_EXCEL_PATH=pathJoin(APP_FOLDER,"AE_PRO_FIX_LIVE_DATABASE.xls");
  ensureFolder(DATA_FOLDER); ensureFolder(ASSET_FOLDER); ensureFolder(BACKUP_FOLDER); ensureFolder(CSV_FOLDER);
 }else{
  APP_FOLDER=""; DATA_FOLDER="data"; ASSET_FOLDER="assets"; BACKUP_FOLDER="backups"; CSV_FOLDER="excel_data"; DB_PATH="data/database.json"; MASTER_EXCEL_PATH="AE_PRO_FIX_LIVE_DATABASE.xls";
 }
 initOnlineDB();
 document.getElementById("loginPass").focus();
}

function getAppFolder(){if(!fso){return "";} var p=decodeURIComponent(location.pathname); if(p.charAt(0)=="/"){p=p.substring(1);} p=p.replace(/\//g,"\\"); return fso.GetParentFolderName(p);}
function pathJoin(a,b){try{if(fso){return fso.BuildPath(a,b);}}catch(e){} return a?(a+"/"+b):b;}
function ensureFolder(p){try{if(fso && !fso.FolderExists(p)){fso.CreateFolder(p);}}catch(e){}}
function readText(p){try{if(!fso){return localStorage.getItem("AEProManagementV1_DB")||"";} var s=new ActiveXObject("ADODB.Stream"); s.Type=2; s.Charset="utf-8"; s.Open(); s.LoadFromFile(p); var t=s.ReadText(); s.Close(); return t;}catch(e){return "";}}
function writeText(p,t){try{if(!fso){if(String(p).indexOf("database")>=0){localStorage.setItem("AEProManagementV1_DB",t);} return;} var s=new ActiveXObject("ADODB.Stream"); s.Type=2; s.Charset="utf-8"; s.Open(); s.WriteText(t); s.SaveToFile(p,2); s.Close();}catch(e){}}
function copyFile(a,b){try{if(fso){fso.CopyFile(a,b,true);}}catch(e){}}
function esc(s){s=String(s==null?"":s); return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function jsq(s){s=String(s==null?"":s); return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g," ").replace(/\n/g," ");}
function trim(s){return String(s==null?"":s).replace(/^\s+|\s+$/g,"");}
function num(v){v=String(v==null?"":v).replace(/,/g,""); var n=parseFloat(v); return isNaN(n)?0:n;}
function pad(n){return n<10?"0"+n:String(n);}
function todayISO(){var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function nowText(){var d=new Date(); return todayISO()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function stamp(){var d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}

function normalizeCustomersByPhone(){
 if(!DB || !DB.CUSTOMERS){return;}
 var map={}, remove=[];
 for(var i=0;i<DB.CUSTOMERS.length;i++){
  var c=DB.CUSTOMERS[i], key=phoneKey(c.Phone); if(!key){continue;}
  if(map[key]){
   var keep=map[key];
   if(!keep.CustomerName && c.CustomerName){keep.CustomerName=c.CustomerName;}
   if(!keep.Email && c.Email){keep.Email=c.Email;}
   if(!keep.Address && c.Address){keep.Address=c.Address;}
   if(c.Notes && String(keep.Notes||"").indexOf(c.Notes)<0){keep.Notes=trim((keep.Notes||"")+" "+c.Notes);}
   replaceCustomerID(c.CustomerID,keep.CustomerID); remove.push(i);
  }else{map[key]=c;}
 }
 for(i=remove.length-1;i>=0;i--){DB.CUSTOMERS.splice(remove[i],1);}
}

}

function jobTotal(j){return num(j.SellPrice||j.Price||0);}
function jobBalance(j){return jobTotal(j)-jobPaid(j.JobID);}
function jobItem(j){return j.Item||j.ServiceName||'';}
function jobDesc(j){return j.Description||j.ServiceCategory||j.Complaint||'';}
function paymentStatus(j){var total=jobTotal(j), paid=jobPaid(j.JobID); if(total<=0 && paid<=0){return "Unpaid";} if(paid>=total){return "Paid";} if(paid>0){return "Partial";} return "Unpaid";}
function ensureCustomer(name, phone){name=trim(name); phone=trim(phone); if(!name && !phone){return "";} var key=phoneKey(phone); if(key){for(var i=0;i<DB.CUSTOMERS.length;i++){if(phoneKey(DB.CUSTOMERS[i].Phone)==key){if(!DB.CUSTOMERS[i].CustomerName && name){DB.CUSTOMERS[i].CustomerName=name;} if(!DB.CUSTOMERS[i].Phone){DB.CUSTOMERS[i].Phone=phone;} return DB.CUSTOMERS[i].CustomerID;}}} var id=nextID("CustomerPrefix","CUSTOMERS","CustomerID"); DB.CUSTOMERS.push({"CustomerID":id,"CustomerName":name,"Phone":phone,"Email":"","Address":"","TotalJobs":"0","Notes":"","CreatedAt":nowText()}); normalizeCustomersByPhone(); return id;}
function customerName(id){var c=findBy("CUSTOMERS","CustomerID",id); return c?(c.CustomerName||""):"";}
function customerPhone(id){var c=findBy("CUSTOMERS","CustomerID",id); return c?(c.Phone||""):"";}
function deviceName(j){var b=trim((j&&j.Brand)||""), m=trim((j&&j.Model)||""); return trim((b?b+" ":"")+m);}

function bucketRows(map){var keys=[], rows=[]; for(var k in map){keys.push(k);} keys.sort(); for(var i=keys.length-1;i>=0;i--){var r=map[keys[i]]; rows.push("<td>"+esc(keys[i])+"</td><td>"+r.jobs+"</td><td>"+money(r.sales)+"</td><td>"+money(r.paid)+"</td><td>"+money(r.cost)+"</td><td>"+money(r.balance)+"</td><td>"+money(r.paid-r.cost)+"</td>");} return rows;}
function countBucketRows(map){var keys=[], rows=[]; for(var k in map){keys.push(k);} keys.sort(function(a,b){return map[b].paid-map[a].paid;}); for(var i=0;i<keys.length;i++){var r=map[keys[i]]; rows.push("<td>"+esc(keys[i])+"</td><td>"+r.jobs+"</td><td>"+money(r.sales)+"</td><td>"+money(r.paid)+"</td><td>"+money(r.cost)+"</td><td>"+money(r.balance)+"</td><td>"+money(r.paid-r.cost)+"</td>");} return rows;}
function exportReportHTML(){var html="<html><head><meta charset='utf-8'><title>AEPro Report</title></head><body>"+document.getElementById("content").innerHTML+"</body></html>"; if(fso){var p=pathJoin(CSV_FOLDER,"AEPro_Report_"+stamp()+".html"); writeText(p,html); toast("Report exported."); openFolder(CSV_FOLDER);}else{downloadTextFile("AEPro_Report_"+stamp()+".html",html);}}
function totalPaid(){var s=0; for(var i=0;i<DB.PAYMENTS.length;i++){s+=num(DB.PAYMENTS[i].Amount);} return s;}
function totalCost(){var s=0; for(var i=0;i<DB.JOBS.length;i++){s+=num(DB.JOBS[i].Cost);} return s;}
function expenseForm(){return "<div class='card'><h3>Add Expense</h3><div class='formGrid'>"+row3("Category","<input id='exCat' class='input'/>","Description","<input id='exDesc' class='input'/>","Amount","<input id='exAmt' class='input'/>")+row3("Date","<input id='exDate' class='input' value='"+todayISO()+"'/>","Action","<button class='btn btnBlue' onclick='addExpense()'>Add Expense</button>","","")+"</div></div>";}
function addExpense(){if(num(val("exAmt"))<=0){toast("Invalid expense amount."); return;} DB.EXPENSES.push({"ExpenseID":"EXP-"+("0000"+(DB.EXPENSES.length+1)).slice(-4),"Date":val("exDate")||todayISO(),"Category":val("exCat"),"Description":val("exDesc"),"Amount":val("exAmt")}); saveDB(); renderPage("reports");}
function deleteExpense(id){if(!confirm("Delete expense "+id+"?")){return;} var idx=findIndexBy("EXPENSES","ExpenseID",id); if(idx>=0){DB.EXPENSES.splice(idx,1);} saveDB(); renderPage("reports");}

function page_searchall(){
 var q=GLOBAL_Q, rows=[]; var packs=[["JOBS","JobID"],["CUSTOMERS","CustomerID"],["INVENTORY","PartID"],["PAYMENTS","PaymentID"],["WARRANTY","WarrantyID"],["PRICEBOOK","ServiceID"]];
 for(var p=0;p<packs.length;p++){var arr=DB[packs[p][0]]||[]; for(var i=0;i<arr.length;i++){if(matchObj(arr[i],q)){rows.push("<td>"+packs[p][0]+"</td><td>"+esc(arr[i][packs[p][1]])+"</td><td>"+esc(JSON.stringify(arr[i]).substr(0,150))+"</td>");}}}
 return "<div class='card'><h2>Global Search Results</h2><div class='softText'>Search: "+esc(q)+"</div>"+table(["Module","ID","Matched Data"],rows)+"</div>";
}

function page_settings(){
 var h="<div class='card'><h2>Settings</h2><div class='formGrid'>";
 h+=row3("Business Name","<input id='sBusiness' class='input' value='"+esc(SETTINGS.BusinessName||"KEDAI REPAIR PHONE")+"'/>","Phone","<input id='sPhone' class='input' value='"+esc(SETTINGS.Phone||"")+"'/>","WhatsApp","<input id='sWA' class='input' value='"+esc(SETTINGS.WhatsApp||"")+"'/>");
 h+=row3("Location","<input id='sLoc' class='input' value='"+esc(SETTINGS.Location||"")+"'/>","SSM / Registration No","<input id='sSSM' class='input' value='"+esc(SETTINGS.SSMNo||"")+"'/>","Logo Path","<input id='sLogo' class='input' value='"+esc(SETTINGS.LogoPath||"assets/ae_pro_fix_logo.png")+"'/>");
 h+=row3("QR Path","<input id='sQR' class='input' value='"+esc(SETTINGS.QRPath||"assets/payment_qr.png")+"'/>","Bank Name","<input id='sBank' class='input' value='"+esc(SETTINGS.BankName||"")+"'/>","Bank Account","<input id='sAcc' class='input' value='"+esc(SETTINGS.BankAccount||"")+"'/>");
 h+=row3("Account Name","<input id='sAccName' class='input' value='"+esc(SETTINGS.AccountName||"")+"'/>","Invoice Prefix","<input id='sInvPrefix' class='input' value='"+esc(SETTINGS.InvoicePrefix||"AEP-INV")+"'/>","Receipt Prefix","<input id='sRecPrefix' class='input' value='"+esc(SETTINGS.ReceiptPrefix||"AEP-RCP")+"'/>");
 h+=row3("Data Mode","<input class='input' value='"+(ONLINE_ENABLED?"Firebase Online":"Local")+"' disabled/>","","","","");
 h+="</div><label class='lbl'>Invoice Note</label><textarea id='sNote' class='textarea'>"+esc(SETTINGS.InvoiceNote||"")+"</textarea><label class='lbl'>Warranty / Terms</label><textarea id='sTerms' class='textarea'>"+esc(SETTINGS.WarrantyTerms||"Warranty bermula selepas repair siap atau pickup. Warranty tidak cover crack, water damage, short, board tamper, atau kerosakan baru selepas pickup.")+"</textarea><div class='formHint'>ID baru ikut format PREFIX-YYYYMMDD-00001.</div><button class='btn btnBlue' onclick='saveSettings()'>Save Settings</button><button class='btn btnPurple' onclick='toggleTheme()'>Switch Dark Mode</button><button class='btn btnGreen' onclick='downloadMonthlyReportExcel()'>Download Monthly Report Excel</button><button class='btn btnGreen' onclick='downloadDatabaseExcel()'>Download Database Excel</button><button class='btn btnOrange' onclick='backupDB()'>Backup Database</button><button class='btn btnRed' onclick='saveAndExit()'>Save & Exit</button></div>";
 h+="<div class='card'><h3>User Login</h3><div class='formGrid'>"+row3("Username","<input id='uName' class='input' value='admin' autocomplete='off'/>","New Password","<input id='uPass' type='password' class='input' autocomplete='off'/>","Action","<button class='btn btnBlue' onclick='updateUserPass()'>Update Login</button>")+"</div><div class='formHint'>Password disimpan dalam bentuk hash dan login akan lock sementara selepas terlalu banyak percubaan gagal.</div></div>";

function saveSettings(){setSetting("BusinessName",val("sBusiness")||"KEDAI REPAIR PHONE"); setSetting("Phone",val("sPhone")); setSetting("WhatsApp",val("sWA")); setSetting("Location",val("sLoc")); setSetting("SSMNo",val("sSSM")); setSetting("LogoPath",val("sLogo")); setSetting("QRPath",val("sQR")); setSetting("BankName",val("sBank")); setSetting("BankAccount",val("sAcc")); setSetting("AccountName",val("sAccName")); setSetting("ExcelAutoSync","No"); setSetting("InvoicePrefix",val("sInvPrefix")||"AEP-INV"); setSetting("ReceiptPrefix",val("sRecPrefix")||"AEP-RCP"); setSetting("InvoiceNote",val("sNote")); setSetting("WarrantyTerms",val("sTerms")); saveDB(); refreshBrand(); toast("Settings saved.");}

function updateUserPass(){var u=trim(val("uName")), p=String(document.getElementById("uPass").value||""); if(!u||!p){toast("Isi username dan password baru."); return;} if(p.length<6){toast("Password minimum 6 character."); return;} var found=false; for(var i=0;i<DB.USERS.length;i++){if(DB.USERS[i].Username==u){DB.USERS[i].PasswordHash=passwordHash(p); DB.USERS[i].Password=""; DB.USERS[i].Status=DB.USERS[i].Status||"Active"; found=true;}} if(!found){DB.USERS.push({"UserID":"USR-"+("000"+(DB.USERS.length+1)).slice(-3),"Username":u,"Password":"","PasswordHash":passwordHash(p),"Role":"Admin","Status":"Active","DisplayName":u});} saveDB(); toast("Login updated.");}

function openFolder(p){try{if(shell){shell.Run('explorer "'+p+'"');}else{toast("Folder open is for Windows HTA only.");}}catch(e){toast("Cannot open folder.");}}
function openLiveExcel(){downloadDatabaseExcel();}

function filteredMonthlyWorkbookXML(){var saveFrom=RPT_FROM, saveTo=RPT_TO; if(!RPT_FROM && !RPT_TO){RPT_FROM=todayISO().substr(0,7)+"-01"; RPT_TO=todayISO();} var rows=[], q=combinedQ(); for(var i=0;i<DB.JOBS.length;i++){var j=DB.JOBS[i]; if(reportJobMatch(j) && (matchObj(j,q)||matchObj({Customer:customerName(j.CustomerID),Phone:customerPhone(j.CustomerID),Payment:paymentStatus(j)},q))){rows.push({"JobID":j.JobID,"Date":j.DateIn,"Customer":customerName(j.CustomerID),"Phone":customerPhone(j.CustomerID),"Item":jobItem(j),"Description":jobDesc(j),"Status":j.Status,"Payment":paymentStatus(j),"Total":jobTotal(j),"Paid":jobPaid(j.JobID),"Cost":num(j.Cost),"Balance":jobBalance(j)});}} RPT_FROM=saveFrom; RPT_TO=saveTo; var xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0F172A" ss:Pattern="Solid"/></Style></Styles>'; xml+=sheetXML("MONTHLY_REPORT",rows); xml+='</Workbook>'; return xml;}
function downloadMonthlyReportExcel(){loadDB(); downloadTextFile("AEPro_Monthly_Report_"+stamp()+".xls",filteredMonthlyWorkbookXML()); toast("Monthly report excel downloaded.");}
function downloadDatabaseExcel(){loadDB(); downloadTextFile("AEPro_Database_"+stamp()+".xls",buildMasterWorkbookXML()); toast("Database excel downloaded.");}

function exportCSVSilent(){try{exportCSV(true);}catch(e){}}
function exportCSV(silent){downloadDatabaseExcel();}

function sheetXML(name,arr){var headers=headersForSheet(name), i,k; arr=arr||[]; for(i=0;i<arr.length;i++){for(k in arr[i]){if(indexOf(headers,k)<0){headers.push(k);}}} if(headers.length==0){headers=["NoData"];} var x='<Worksheet ss:Name="'+xmlSafeName(name)+'"><Table>'; for(i=0;i<headers.length;i++){x+='<Column ss:Width="110"/>';} x+='<Row>'; for(i=0;i<headers.length;i++){x+='<Cell ss:StyleID="hdr"><Data ss:Type="String">'+xmlEsc(headers[i])+'</Data></Cell>';} x+='</Row>'; for(i=0;i<arr.length;i++){x+='<Row>'; for(var c=0;c<headers.length;c++){x+=xmlCell(arr[i][headers[c]]);} x+='</Row>';} x+='</Table></Worksheet>'; return x;}
function xmlCell(v){v=String(v==null?"":v); var n=parseFloat(v); var isN=(v!=="" && !isNaN(n) && String(n)==v); return '<Cell><Data ss:Type="'+(isN?'Number':'String')+'">'+xmlEsc(v)+'</Data></Cell>';}
function xmlEsc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function xmlSafeName(n){return String(n).replace(/[\\/\?\*\[\]:]/g,"_").substr(0,31);}
function writeCSV(name,arr){}
function csvCell(v){v=String(v==null?"":v); v=v.replace(/"/g,'""'); return '"'+v+'"';}
function indexOf(a,x){for(var i=0;i<a.length;i++){if(a[i]==x){return i;}} return -1;}
function backupDB(){loadDB(); var s=stamp(); if(!fso){downloadTextFile("database_backup_"+s+".json",JSON.stringify(DB,null,2)); toast("Backup downloaded."); return;} var p=pathJoin(BACKUP_FOLDER,"database_backup_"+s+".json"); writeText(p,JSON.stringify(DB,null,2)); toast("Backup saved.");}

function saveAndExit(){saveDB(); try{if(fso){window.close();}else{toast("Data saved.");}}catch(e){}}
window.onbeforeunload=function(){try{saveDB();}catch(e){}};

window.onload=init;
